version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: notara-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notara}
      POSTGRES_USER: ${POSTGRES_USER:-notara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notara}
    ports:
      - "5432:5432"
    volumes:
      - notara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notara} -d ${POSTGRES_DB:-notara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    container_name: notara-backend
    working_dir: /workspace
    command: >
      sh -lc "pip install --no-cache-dir -r backend/requirements.txt &&
      python backend/manage.py migrate &&
      python backend/manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-notara}
      POSTGRES_USER: ${POSTGRES_USER:-notara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notara}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: notara-frontend
    working_dir: /app
    command: >
      sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  notara_postgres_data:
