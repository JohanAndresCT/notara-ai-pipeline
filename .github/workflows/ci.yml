name: CI Notara
on:
  pull_request:
  push:
    branches:
      - main
      - despliegue-documentacion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: notara
      POSTGRES_USER: notara
      POSTGRES_PASSWORD: notara
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notara
          POSTGRES_USER: notara
          POSTGRES_PASSWORD: notara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notara -d notara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Django configuration
        run: python backend/manage.py check
      - name: Apply database migrations
        run: python backend/manage.py migrate --noinput
      - name: Run backend tests
        run: python backend/manage.py test --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
